<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Learning to Remember — Lawrence Feng</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" crossorigin="anonymous" />
<style>
/* Early Exposure — paper website
   Warm editorial palette, Distill-inspired typography */

:root {
  --bg: #f6f1e8;
  --bg-tint: #efe7d6;
  --bg-deeper: #e6dcc7;
  --ink: #1a1814;
  --slate: #3d3833;
  --body: #2a2622;
  --muted: #8a7f6f;
  --rule: #d8cfbb;
  --rule-strong: #b8ad95;

  --accent: #c2410c;        /* terracotta — "early" / new frontier */
  --accent-soft: #e8a17a;
  --accent-tint: rgba(194, 65, 12, 0.08);
  --cool: #475569;          /* deep slate — "late" / baseline */
  --cool-soft: #94a3b8;

  --serif: "Source Serif 4", "Source Serif Pro", "Iowan Old Style", "Charter", Georgia, serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "Berkeley Mono", "SF Mono", "Menlo", monospace;

  --col: 720px;
  --col-wide: 1080px;
  --col-figure: 1100px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--body);
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.65;
  font-feature-settings: "kern", "liga", "onum";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--accent); color: var(--bg); }

a {
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--rule-strong);
  transition: border-color 0.15s, color 0.15s;
}
a:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- Layout ---------- */

.page { padding: 0 32px; }

.col, .col-wide, .col-figure {
  margin-left: auto;
  margin-right: auto;
}
.col { max-width: var(--col); }
.col-wide { max-width: var(--col-wide); }
.col-figure { max-width: var(--col-figure); }

/* ---------- Top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
  font-family: var(--sans);
  font-size: 13px;
}
.topbar-inner {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 32px;
  gap: 24px;
}
.topbar .brand {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  border: none;
}
.topbar nav {
  display: flex;
  gap: 28px;
  color: var(--slate);
}
.topbar nav a {
  border: none;
  color: var(--slate);
  font-size: 13px;
}
.topbar nav a:hover { color: var(--accent); }
.topbar .cta {
  border: 1px solid var(--ink);
  padding: 7px 14px;
  border-radius: 999px;
  color: var(--ink);
  font-weight: 500;
}
.topbar .cta:hover { background: var(--ink); color: var(--bg); }
.topbar .cta.disabled { opacity: 0.45; pointer-events: none; }

/* ---------- Hero ---------- */

.hero {
  padding: 120px 0 80px;
  border-bottom: 1px solid var(--rule);
}
.hero .eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 32px;
}
.hero h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(40px, 6vw, 76px);
  line-height: 1.04;
  letter-spacing: -0.02em;
  margin: 0 0 32px;
  color: var(--ink);
  max-width: 18ch;
}
.hero h1 em {
  font-style: italic;
  color: var(--accent);
}
.hero .lede {
  font-size: 22px;
  line-height: 1.55;
  color: var(--slate);
  max-width: 60ch;
  margin: 0 0 48px;
}
.hero .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 48px 64px;
  align-items: flex-start;
  font-family: var(--sans);
  font-size: 14px;
}
.hero .meta-block .label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.hero .meta-block .value {
  color: var(--ink);
  line-height: 1.5;
}
.hero .meta-block a { font-size: 14px; }
.hero .actions {
  margin-top: 56px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.hero .actions a {
  font-family: var(--sans);
  font-size: 14px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--ink);
  color: var(--ink);
}
.hero .actions a.primary {
  background: var(--ink);
  color: var(--bg);
}
.hero .actions a.primary:hover { background: var(--accent); border-color: var(--accent); }
.hero .actions a:hover { color: var(--accent); border-color: var(--accent); }
.hero .actions a.primary:hover { color: var(--bg); }
.hero .actions a.disabled {
  opacity: 0.45;
  pointer-events: none;
}

/* ---------- Section chrome ---------- */

section { padding: 96px 0; border-bottom: 1px solid var(--rule); }
section:last-of-type { border-bottom: none; }

.part-marker {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.part-marker::before {
  content: "";
  width: 28px; height: 1px;
  background: var(--accent);
}
.section-h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(32px, 4vw, 48px);
  line-height: 1.1;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin: 0 0 24px;
  max-width: 22ch;
}
.section-h2 em { font-style: italic; color: var(--accent); }

.section-lede {
  font-size: 20px;
  line-height: 1.55;
  color: var(--slate);
  max-width: 54ch;
  margin: 0 0 56px;
}

h3 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 24px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 56px 0 16px;
}

p { margin: 0 0 1.1em; }
p + p { text-indent: 0; }

strong { font-weight: 600; color: var(--ink); }
em { font-style: italic; }

.lambda {
  font-family: var(--serif);
  font-style: italic;
  color: var(--accent);
  font-weight: 500;
}

.callout {
  margin: 32px 0;
  padding: 24px 28px;
  background: var(--bg-tint);
  border-left: 2px solid var(--accent);
  border-radius: 0 4px 4px 0;
}
.callout .callout-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}
.callout p:last-child { margin-bottom: 0; }

/* ---------- Thesis pull-quote ---------- */
.thesis-pull {
  margin: 56px auto;
  padding: 56px 24px;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  text-align: center;
  max-width: 100%;
}
.thesis-pull .thesis-eyebrow {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 24px;
}
.thesis-pull p {
  font-family: var(--serif);
  font-size: clamp(40px, 6.4vw, 88px);
  line-height: 1.05;
  font-weight: 400;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--ink);
  text-wrap: balance;
}

.aside {
  font-family: var(--sans);
  font-size: 14px;
  color: var(--muted);
  line-height: 1.55;
  border-top: 1px solid var(--rule);
  padding-top: 12px;
  margin-top: 40px;
  max-width: 56ch;
}

/* ---------- Figure caption ---------- */

figure { margin: 56px 0; }
.figure-compact { max-width: 880px; margin-left: auto; margin-right: auto; }
figcaption {
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.55;
  color: var(--muted);
  margin-top: 20px;
  max-width: 60ch;
  margin-left: auto;
  margin-right: auto;
  text-align: left;
}
figcaption strong {
  color: var(--ink);
  font-weight: 600;
  display: block;
  margin-bottom: 4px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-family: var(--mono);
}

/* ---------- Pipeline diagram (formal × instantiation) ---------- */

.pipeline-diagram {
  display: grid;
  grid-template-columns: 1fr 56px 1fr 56px 1fr;
  gap: 0;
  margin: 56px 0 32px;
  position: relative;
  align-items: stretch;
}

.pipeline-actor {
  position: absolute;
  left: 0;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 12px;
  pointer-events: none;
}
.pipeline-actor .actor-line {
  display: block;
  height: 1px;
  background: var(--rule-strong);
  flex: 1;
}
.pipeline-actor .actor-label {
  white-space: nowrap;
  background: var(--bg);
  padding: 0 10px;
  position: relative;
  z-index: 1;
}
.pipeline-actor-upstream {
  top: -22px;
  width: calc((100% - 112px) / 3 * 2 + 56px);
}
.pipeline-actor-downstream {
  top: -22px;
  left: auto;
  right: 0;
  width: calc((100% - 112px) / 3);
}

.pipeline-stage {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 28px 22px 22px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  text-align: center;
}
.pipeline-stage .stage-formal {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--muted);
  line-height: 1;
}
.pipeline-stage .stage-formal sub {
  font-family: var(--mono);
  font-style: normal;
  font-size: 12px;
  letter-spacing: 0.05em;
}
.pipeline-stage .stage-headline {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.15;
  letter-spacing: -0.005em;
  margin-top: 2px;
}
.pipeline-stage .stage-instance {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  line-height: 1.4;
  padding-top: 10px;
  border-top: 1px solid var(--rule);
  margin-top: 4px;
}
.pipeline-stage .stage-note {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
  margin-top: auto;
}

.pipeline-stage.stage-pretrain {
  background: var(--bg-deeper);
}
.pipeline-stage.stage-posttrain {
  background: color-mix(in srgb, var(--accent) 9%, var(--bg));
  border-color: color-mix(in srgb, var(--accent) 35%, var(--rule));
}
.pipeline-stage.stage-posttrain .stage-formal,
.pipeline-stage.stage-posttrain .stage-headline {
  color: color-mix(in srgb, var(--accent) 80%, var(--ink));
}
.pipeline-stage.stage-finetune {
  background: color-mix(in srgb, var(--cool) 9%, var(--bg));
  border-color: color-mix(in srgb, var(--cool) 35%, var(--rule));
}
.pipeline-stage.stage-finetune .stage-formal,
.pipeline-stage.stage-finetune .stage-headline {
  color: color-mix(in srgb, var(--cool) 80%, var(--ink));
}

.pipeline-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  position: relative;
  min-height: 80px;
}
.pipeline-arrow svg {
  width: 100%;
  height: 24px;
}
.pipeline-arrow .arrow-label {
  position: absolute;
  top: calc(50% - 38px);
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 9px;
  line-height: 1.25;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  background: var(--bg);
  padding: 2px 4px;
}

.pipeline-table {
  margin: 16px 0 24px;
  padding: 24px;
  background: var(--bg-tint);
  border: 1px solid var(--rule);
  border-radius: 8px;
}
.pipeline-table-caption {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 18px;
  max-width: 70ch;
}
.pipeline-table-caption strong { color: var(--ink); font-weight: 600; }
.pipeline-table-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  font-family: var(--mono);
  font-size: 13px;
  border-top: 1px solid var(--rule-strong);
}
.pipeline-table-grid .pt-h {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--rule);
  background: transparent;
}
.pipeline-table-grid .pt-h em {
  text-transform: none;
  letter-spacing: 0;
  font-style: italic;
  font-family: var(--serif);
}
.pipeline-table-grid .pt-c {
  padding: 12px 14px;
  border-bottom: 1px solid var(--rule);
  color: var(--ink);
}
.pipeline-table-grid .pt-name {
  font-family: var(--serif);
  font-size: 15px;
  color: var(--ink);
}
.pipeline-table-grid > div:nth-last-child(-n+4) {
  border-bottom: none;
}

/* ---------- Lambda slider widget ---------- */

.lambda-widget {
  background: var(--bg-tint);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 36px 36px 28px;
  margin: 24px 0;
}
.lambda-widget--compact {
  padding: 14px 18px 10px;
  margin: 16px 0 0;
  border-radius: 8px;
}
.lambda-widget--compact .label-row { margin-bottom: 8px; }
.lambda-widget--compact .lambda-track-wrap { height: 48px; margin-bottom: 18px; }
.lambda-widget--compact .lambda-track { top: 14px; height: 3px; }
.lambda-widget--compact .lambda-thumb {
  top: 8px;
  width: 16px; height: 16px;
}
.lambda-widget--compact .lambda-tick { font-size: 10px; }
.lambda-widget--compact .lambda-tick::before { width: 1px; height: 6px; }
.lambda-widget .label-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 18px;
  letter-spacing: 0.06em;
}
.lambda-widget .lambda-value {
  font-family: var(--serif);
  font-style: italic;
  font-size: 28px;
  color: var(--accent);
  font-weight: 500;
}
.lambda-track-wrap {
  position: relative;
  height: 64px;
  margin-bottom: 36px;
}
.lambda-track {
  position: absolute;
  top: 24px;
  left: 0; right: 0;
  height: 4px;
  background: var(--rule-strong);
  border-radius: 2px;
}
.lambda-track-fill {
  position: absolute;
  top: 24px; left: 0;
  height: 4px;
  background: var(--accent);
  border-radius: 2px;
}
.lambda-widget--compact .lambda-track-fill { top: 14px; height: 3px; }
.lambda-thumb {
  position: absolute;
  top: 14px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--bg);
  box-shadow: 0 2px 8px rgba(194, 65, 12, 0.35);
  cursor: grab;
  transform: translateX(-50%);
  transition: box-shadow 0.15s, transform 0.05s;
}
.lambda-thumb:active { cursor: grabbing; transform: translateX(-50%) scale(1.08); }
.lambda-ticks {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.lambda-tick {
  position: absolute;
  bottom: 0;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  transform: translateX(-50%);
  text-align: center;
  white-space: nowrap;
}
.lambda-tick::before {
  content: "";
  display: block;
  width: 1px; height: 6px;
  background: var(--rule-strong);
  margin: 0 auto 4px;
}

/* ---------- Training timeline ---------- */

.timeline {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 28px;
  position: relative;
}
.timeline-stages {
  display: flex;
  height: 72px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--rule-strong);
  position: relative;
  background: var(--bg-tint);
}
.timeline-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  transition: flex 0.4s ease, background 0.4s ease;
  overflow: hidden;
}
.timeline-stage.pretrain { background: var(--bg-deeper); color: var(--slate); }
.timeline-stage.posttrain { background: var(--accent); color: var(--bg); }
.timeline-stage.finetune { background: var(--cool); color: var(--bg); }
.timeline-stage .stage-name { padding: 0 12px; z-index: 2; position: relative; }

.dot-field {
  position: absolute;
  inset: 4px;
  display: grid;
  gap: 1px;
  pointer-events: none;
  z-index: 1;
}
.dot-cell {
  border-radius: 1px;
  transition: background 0.25s ease;
}

.timeline-hint {
  margin-top: 14px;
  font-family: var(--sans);
  font-size: 12px;
  line-height: 1.55;
  color: var(--muted);
  max-width: 64ch;
}

.timeline-legend {
  display: flex;
  gap: 20px;
  margin-top: 20px;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--slate);
  flex-wrap: wrap;
}
.timeline-legend .swatch {
  display: inline-block;
  width: 14px; height: 14px;
  border-radius: 3px;
  vertical-align: middle;
  margin-right: 8px;
  border: 1px solid var(--rule-strong);
}
.swatch-pretrain { background: var(--bg-deeper); }
.swatch-posttrain { background: var(--accent); border-color: var(--accent); }
.swatch-finetune { background: var(--cool); border-color: var(--cool); }

.timeline-readout {
  display: flex;
  gap: 32px;
  margin-top: 20px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--slate);
}
.timeline-readout strong {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--ink);
}

/* ---------- Pareto chart ---------- */

.pipeline-picker {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 24px 0 16px;
}
.pipeline-picker .pipeline-btn {
  flex: 1 1 0;
  min-width: 180px;
  max-width: 260px;
}
.pipeline-btn {
  appearance: none;
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 14px 14px 12px;
  cursor: pointer;
  text-align: left;
  font-family: var(--sans);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: background 0.15s, border-color 0.15s, transform 0.05s;
}
.pipeline-btn:hover { background: var(--bg-tint); border-color: var(--ink); }
.pipeline-btn:active { transform: translateY(1px); }
.pipeline-btn.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}
.pipeline-btn.is-active .pipeline-btn-sub { color: var(--bg); opacity: 0.7; }
.pipeline-btn-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
.pipeline-btn-sub {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
@media (max-width: 720px) {
  .pipeline-picker .pipeline-btn { min-width: 140px; }
}

.pareto-wrap {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 32px;
}
.pareto-svg { width: 100%; height: auto; display: block; }
.pareto-readout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px 32px;
  margin-top: 24px;
  font-family: var(--sans);
  font-size: 13px;
}
.pareto-readout .readout-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.pareto-readout .readout-value {
  font-family: var(--mono);
  font-size: 16px;
  color: var(--ink);
}

/* ---------- Chart legends (rendered above the SVG, not inside it) ---------- */

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  align-items: center;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink);
  margin-bottom: 16px;
}
.chart-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.chart-legend-item--interactive {
  cursor: pointer;
}
.chart-legend-swatch {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
}
.chart-legend-line {
  display: inline-block;
  width: 22px;
  height: 3px;
  border-radius: 2px;
}
.chart-legend-meta {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
}

/* ---------- U-shape chart ---------- */

.ushape-wrap {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 32px;
}

/* ---------- Themes (3 cards) ---------- */

.themes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin: 48px 0;
}
.theme-card {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.theme-card .theme-num {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--accent);
  text-transform: uppercase;
}
.theme-card .theme-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  line-height: 1.25;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.theme-card .theme-body {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.55;
  color: var(--slate);
}

/* ---------- Patches list ---------- */

.patches {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 32px 0;
}
.patch-card {
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 20px;
  background: var(--bg);
}
.patch-card .patch-name {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cool);
  margin-bottom: 8px;
}
.patch-card .patch-desc {
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.5;
  color: var(--slate);
}

/* ---------- Limitations grid ---------- */

.limgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  margin: 32px 0;
}
.limgrid h4 {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 16px;
}
.limgrid ul { list-style: none; padding: 0; margin: 0; }
.limgrid li {
  padding: 14px 0;
  border-top: 1px solid var(--rule);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.5;
  color: var(--slate);
}
.limgrid li:last-child { border-bottom: 1px solid var(--rule); }
.limgrid li strong {
  display: block;
  color: var(--ink);
  margin-bottom: 4px;
  font-weight: 600;
}

/* ---------- Footer ---------- */

.footer {
  padding: 64px 0 80px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--muted);
}
.footer .footer-inner {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 48px;
  flex-wrap: wrap;
}
.footer .cite {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--bg-tint);
  border: 1px solid var(--rule);
  padding: 16px 20px;
  border-radius: 6px;
  color: var(--slate);
  white-space: pre-wrap;
  max-width: 540px;
  line-height: 1.6;
}

/* ---------- Responsive ---------- */

@media (max-width: 880px) {
  body { font-size: 18px; }
  .pipeline-diagram { grid-template-columns: 1fr; }
  .pipeline-arrow { min-height: 32px; transform: rotate(90deg); }
  .pipeline-actor { display: none; }
  .pipeline-table-grid { grid-template-columns: 1fr; }
  .pipeline-table-grid .pt-h:not(:first-child) { display: none; }
  .themes { grid-template-columns: 1fr; }
  .patches { grid-template-columns: 1fr; }
  .limgrid { grid-template-columns: 1fr; gap: 32px; }
  .hero { padding: 80px 0 56px; }
  section { padding: 64px 0; }
  .topbar nav { display: none; }
}

.kbd {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--bg-deeper);
  border: 1px solid var(--rule-strong);
  border-radius: 4px;
  padding: 2px 6px;
  color: var(--slate);
}

.divider-dot {
  text-align: center;
  font-family: var(--mono);
  color: var(--rule-strong);
  letter-spacing: 1em;
  margin: 48px 0;
}

.part-num { font-variant-numeric: oldstyle-nums; }
</style>

// Lower-left convex-hull arc — mirrors plot_icml_sweep_tradeoffs.compute_convex_hull_points:
// build the lower hull via Andrew's monotone chain, then trim from leftmost to bottommost.
// Used for the "frontier" line drawn through scatter points (lower-left = better).
function lowerLeftFrontier(points) {
  if (!points || points.length < 2) return points || [];
  // Dedupe and sort by x asc, y asc.
  const seen = new Set();
  const pts = [];
  for (const p of points) {
    const k = `${p[0]},${p[1]}`;
    if (!seen.has(k)) { seen.add(k); pts.push(p); }
  }
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length < 3) return pts;

  // Lower hull: pop while last 3 points make a non-left turn (cross <= 0).
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2) {
      const o = lower[lower.length - 2];
      const a = lower[lower.length - 1];
      const cross = (a[0] - o[0]) * (p[1] - o[1]) - (a[1] - o[1]) * (p[0] - o[0]);
      if (cross <= 0) lower.pop();
      else break;
    }
    lower.push(p);
  }

  // Trim at bottommost point — that's where the lower-left arc ends.
  let bottomIdx = 0;
  for (let i = 1; i < lower.length; i++) {
    if (lower[i][1] < lower[bottomIdx][1]) bottomIdx = i;
  }
  return lower.slice(0, bottomIdx + 1);
}

// ---------- λ slider primitive ----------
function LambdaSlider({ value, onChange, ticks = [0, 0.25, 0.5, 0.75, 1], compact = true }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const snapToTick = (t) => {
    let best = ticks[0], bestD = Infinity;
    for (const tk of ticks) {
      const d = Math.abs(tk - t);
      if (d < bestD) { bestD = d; best = tk; }
    }
    return best;
  };

  // Track the raw (unsnapped) cursor-derived value during a drag so we can
  // commit the nearest tick on release. The thumb and the chart's vertical
  // guide follow this continuous value while dragging; per-series markers
  // independently snap to the nearest discrete data point inside each chart.
  const lastValueRef = React.useRef(value);

  const setFromClientX = (clientX, { snap }) => {
    const r = trackRef.current.getBoundingClientRect();
    const t = clamp((clientX - r.left) / r.width, 0, 1);
    const v = snap ? snapToTick(t) : t;
    lastValueRef.current = v;
    onChange(v);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onMove = (e) => {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      setFromClientX(x, { snap: false });   // continuous tracking while dragging
    };
    const onUp = () => {
      setDragging(false);
      onChange(snapToTick(lastValueRef.current));   // commit-snap on release
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("touchmove", onMove);
    window.addEventListener("mouseup", onUp);
    window.addEventListener("touchend", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("touchend", onUp);
    };
  });

  const onDown = (e) => {
    e.preventDefault();
    setDragging(true);
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    setFromClientX(x, { snap: false });   // tap = start dragging from cursor
  };

  return (
    <div className={`lambda-widget${compact ? " lambda-widget--compact" : ""}`}>
      <div className="label-row">
        <span>λ&nbsp;&nbsp;mix-in fraction</span>
        <span className="lambda-value">λ = {value.toFixed(2)}</span>
      </div>
      <div
        className="lambda-track-wrap"
        ref={trackRef}
        onMouseDown={onDown}
        onTouchStart={onDown}
        style={{ touchAction: "none" }}
      >
        <div className="lambda-track" />
        <div className="lambda-track-fill" style={{ width: `${value * 100}%` }} />
        <div className="lambda-thumb" style={{ left: `${value * 100}%` }} />
        <div className="lambda-ticks">
          {ticks.map((t) => (
            <div key={t} className="lambda-tick" style={{ left: `${t * 100}%` }}>
              {t.toFixed(2)}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------- Training timeline ----------
function TrainingTimeline({ lambda, mode = "main" }) {
  const pretrainBaseW = mode === "compute-matched" ? 0.62 : 0.66;
  const finetuneW = 0.18;
  const posttrainW =
    mode === "compute-matched" ? 0.18 * (1 - lambda) : 0.16;
  const total = pretrainBaseW + posttrainW + finetuneW;
  const pW = pretrainBaseW / total;
  const ptW = posttrainW / total;
  const ftW = finetuneW / total;

  const COLS = 60, ROWS = 6;
  const TOTAL_CELLS = COLS * ROWS;
  const MAX_DENSITY = 0.03;
  const targetCount = Math.round(TOTAL_CELLS * MAX_DENSITY * lambda);

  const cells = React.useMemo(() => {
    const out = []; let s = 1234567;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      s = (s * 1664525 + 1013904223) >>> 0;
      out.push({ r, c, rank: (s & 0xffffff) / 0xffffff });
    }
    return out;
  }, []);
  const sortedRanks = React.useMemo(
    () => cells.map((x) => x.rank).sort((a, b) => a - b), [cells]);
  const cutoff = targetCount > 0 ? sortedRanks[Math.min(targetCount - 1, sortedRanks.length - 1)] : -1;

  return (
    <div className="timeline">
      <div className="timeline-stages">
        <div className="timeline-stage pretrain" style={{ flex: pW }}>
          <div className="dot-field" style={{
            gridTemplateColumns: `repeat(${COLS}, 1fr)`,
            gridTemplateRows: `repeat(${ROWS}, 1fr)`,
          }}>
            {cells.map((cell) => {
              const on = targetCount > 0 && cell.rank <= cutoff;
              return (
                <div key={`${cell.r}-${cell.c}`} className="dot-cell"
                  style={{ background: on ? "var(--accent)" : "transparent",
                           opacity: on ? 1 : 0 }} />
              );
            })}
          </div>
          <span className="stage-name">Pretraining&nbsp;·&nbsp;C4</span>
        </div>
        <div className="timeline-stage posttrain"
          style={{ flex: ptW, opacity: ptW > 0.001 ? (ptW > 0.04 ? 1 : 0.6) : 0,
                   visibility: ptW > 0.001 ? "visible" : "hidden" }}>
          <span className="stage-name" style={{ opacity: ptW > 0.06 ? 1 : 0 }}>
            Post-train · Music
          </span>
        </div>
        <div className="timeline-stage finetune" style={{ flex: ftW }}>
          <span className="stage-name">Fine-tune · Chemistry</span>
        </div>
      </div>

      <div className="timeline-readout">
        {mode === "main" ? (
          <>
            <div>
              <strong>{(lambda * MAX_DENSITY * 100).toFixed(1)}%</strong> of pretraining is post-training data
            </div>
            <div>Dedicated post-training stage held&nbsp;<strong>fixed</strong></div>
          </>
        ) : (
          <>
            <div>
              <strong>{(lambda * MAX_DENSITY * 100).toFixed(1)}%</strong> of pretraining is post-training data
            </div>
            <div>
              Dedicated post-training stage shrinks with&nbsp;<span className="lambda">λ</span>
              {lambda >= 1 ? <> · <strong>none at λ = 1</strong></> : null}
            </div>
          </>
        )}
      </div>

      <div className="timeline-legend">
        <span><span className="swatch swatch-pretrain" />Pretraining (C4)</span>
        <span><span className="swatch swatch-posttrain" />Post-training (Music)</span>
        <span><span className="swatch swatch-finetune" />Fine-tuning (Chemistry)</span>
      </div>

    </div>
  );
}

// ---------- Pareto frontier chart (Figure 1) ----------
// Each pipeline shows TWO panels side-by-side: (left) Retained Post-training Loss
// vs Retained Pretraining Loss, (right) Fine-tuning Loss vs Retained Post-training
// Loss. Lambda=0 ("unmixed") and lambda=1 ("mixed") frontiers are overlaid in each.
function ParetoPanel({ unmixed, mixed, xLabel, yLabel, panelId }) {
  const [hover, setHover] = React.useState(null);
  const svgRef = React.useRef(null);

  const W = 360, H = 380;
  const PAD_L = 60, PAD_B = 56, PAD_T = 22, PAD_R = 18;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;

  const unmixedFrontier = lowerLeftFrontier(unmixed);
  const mixedFrontier = lowerLeftFrontier(mixed);

  // Auto-zoom to bounding box of the union of frontier points (with 5% pad).
  // Outliers far from the frontier would blow up the visible range and hide
  // the gap between the two frontiers.
  const frontierUnion = [...unmixedFrontier, ...mixedFrontier];
  const padFrac = 0.05;
  const xs = frontierUnion.map((p) => p[0]);
  const ys = frontierUnion.map((p) => p[1]);
  const xLo = Math.min(...xs), xHi = Math.max(...xs);
  const yLo = Math.min(...ys), yHi = Math.max(...ys);
  const xPad = (xHi - xLo) * padFrac || 0.05;
  const yPad = (yHi - yLo) * padFrac || 0.05;
  const xRange = [xLo - xPad, xHi + xPad];
  const yRange = [yLo - yPad, yHi + yPad];
  const sx = (x) => PAD_L + ((x - xRange[0]) / (xRange[1] - xRange[0])) * innerW;
  const sy = (y) => PAD_T + (1 - (y - yRange[0]) / (yRange[1] - yRange[0])) * innerH;

  const path = (pts) =>
    pts.map((p, i) => `${i ? "L" : "M"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");

  const allPts = [...unmixed.map((p) => ({ p, group: "unmixed" })),
                  ...mixed.map((p) => ({ p, group: "mixed" }))];

  const onMove = (e) => {
    if (!svgRef.current) return;
    const r = svgRef.current.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    const py = ((e.clientY - r.top) / r.height) * H;
    let best = null, bestD = 24 * 24;
    for (const item of allPts) {
      const dx = sx(item.p[0]) - px;
      const dy = sy(item.p[1]) - py;
      const d2 = dx * dx + dy * dy;
      if (d2 < bestD) { bestD = d2; best = item; }
    }
    setHover(best);
  };
  const onLeave = () => setHover(null);

  // Evenly-spaced ticks across the auto-zoomed range (4 intervals = 5 ticks).
  const xTicks = [], yTicks = [];
  for (let i = 0; i <= 4; i++) {
    xTicks.push(+(xRange[0] + i * (xRange[1] - xRange[0]) / 4).toFixed(2));
    yTicks.push(+(yRange[0] + i * (yRange[1] - yRange[0]) / 4).toFixed(2));
  }

  const COLOR_UNMIXED = "var(--ink)";
  const COLOR_MIXED = "#7b2d8e";

  const drawScatter = (pts, color) =>
    pts.map((p, i) => (
      <circle key={`${color}${i}`} cx={sx(p[0])} cy={sy(p[1])} r="3"
        fill={color} stroke="var(--bg)" strokeWidth="0.5" opacity="0.85" />
    ));

  const clipId = `paretoClip-${panelId}`;

  return (
    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="pareto-svg"
      onMouseMove={onMove} onMouseLeave={onLeave}>
      {xTicks.map((t) => (
        <line key={`gx${t}`} x1={sx(t)} x2={sx(t)} y1={PAD_T} y2={H - PAD_B}
          stroke="var(--rule)" strokeWidth="1" strokeDasharray="2 4" />
      ))}
      {yTicks.map((t) => (
        <line key={`gy${t}`} y1={sy(t)} y2={sy(t)} x1={PAD_L} x2={W - PAD_R}
          stroke="var(--rule)" strokeWidth="1" strokeDasharray="2 4" />
      ))}

      <line x1={PAD_L} x2={W - PAD_R} y1={H - PAD_B} y2={H - PAD_B}
        stroke="var(--ink)" strokeWidth="1" />
      <line x1={PAD_L} x2={PAD_L} y1={PAD_T} y2={H - PAD_B}
        stroke="var(--ink)" strokeWidth="1" />

      {xTicks.map((t) => (
        <text key={`tx${t}`} x={sx(t)} y={H - PAD_B + 18}
          fontFamily="var(--mono)" fontSize="10" fill="var(--muted)" textAnchor="middle">
          {t.toFixed(2)}
        </text>
      ))}
      {yTicks.map((t) => (
        <text key={`ty${t}`} x={PAD_L - 10} y={sy(t) + 4}
          fontFamily="var(--mono)" fontSize="10" fill="var(--muted)" textAnchor="end">
          {t.toFixed(2)}
        </text>
      ))}

      <text x={PAD_L + innerW / 2} y={H - 12}
        fontFamily="var(--sans)" fontSize="12" fill="var(--slate)" textAnchor="middle">
        {xLabel} →
      </text>
      <text x={-(PAD_T + innerH / 2)} y={14} transform="rotate(-90)"
        fontFamily="var(--sans)" fontSize="12" fill="var(--slate)" textAnchor="middle">
        {yLabel} →
      </text>

      <defs>
        <clipPath id={clipId}>
          <rect x={PAD_L} y={PAD_T} width={innerW} height={innerH} />
        </clipPath>
      </defs>

      <g clipPath={`url(#${clipId})`}>
        {unmixedFrontier.length >= 2 && (
          <path d={path(unmixedFrontier)} fill="none" stroke={COLOR_UNMIXED}
            strokeWidth="2.5" opacity="0.7" />
        )}
        {mixedFrontier.length >= 2 && (
          <path d={path(mixedFrontier)} fill="none" stroke={COLOR_MIXED}
            strokeWidth="2.5" opacity="0.7" />
        )}

        {drawScatter(unmixed, COLOR_UNMIXED)}
        {drawScatter(mixed, COLOR_MIXED)}

        {hover && (
          <circle cx={sx(hover.p[0])} cy={sy(hover.p[1])} r="6"
            fill="none" stroke={hover.group === "mixed" ? COLOR_MIXED : COLOR_UNMIXED}
            strokeWidth="2" style={{ pointerEvents: "none" }} />
        )}
      </g>
    </svg>
  );
}

// ---------- Immediate vs. Retained MusicPile loss across λ ----------
// Reads PAPER_DATA.lambda_curves[mode][P]: { lambdas, immediate, retained }.
// Five sampled λ values per series; three token budgets (30M / 150M / 300M).
function ImmediateVsRetainedChart({ lambda, onLambdaChange, mode = "interpolation" }) {
  const W = 760, H = 360;
  const PAD_L = 64, PAD_R = 24, PAD_T = 36, PAD_B = 60;
  const GAP = 36;
  const panelW = (W - PAD_L - PAD_R - GAP) / 2;
  const innerH = H - PAD_T - PAD_B;

  const curves = ((PAPER_DATA.lambda_curves || {})[mode]) || {};
  const pKeys = Object.keys(curves).sort((a, b) => Number(a) - Number(b));
  if (!pKeys.length) {
    return (
      <div className="ushape-wrap" style={{ color: "var(--muted)", fontFamily: "var(--sans)", fontSize: 13 }}>
        No {mode} data found.
      </div>
    );
  }

  const series = pKeys.map((p) => Number(p));
  const seriesColor = (k) =>
    k <= 30000000 ? "var(--cool)" : k <= 150000000 ? "var(--accent)" : "var(--ink)";
  const seriesLabel = (k) => (
    <><Tex tex={`|D_{\\mathrm{post}}|`} /> = {Math.round(k / 1e6)}M tokens</>
  );

  // Auto y-range from data (with small padding); shared between panels.
  let yLo = Infinity, yHi = -Infinity;
  for (const p of pKeys) {
    for (const v of curves[p].immediate) { yLo = Math.min(yLo, v); yHi = Math.max(yHi, v); }
    for (const v of curves[p].retained)  { yLo = Math.min(yLo, v); yHi = Math.max(yHi, v); }
  }
  const yPad = (yHi - yLo) * 0.1 || 0.05;
  const yMin = yLo - yPad, yMax = yHi + yPad;

  const xRange = [0, 1];
  const sx = (x, panelIdx) =>
    PAD_L + panelIdx * (panelW + GAP) + ((x - xRange[0]) / (xRange[1] - xRange[0])) * panelW;
  const sy = (y) => PAD_T + (1 - (y - yMin) / (yMax - yMin)) * innerH;

  const svgRef = React.useRef(null);
  const handleClick = (e) => {
    if (!onLambdaChange) return;
    const r = svgRef.current.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    for (let p = 0; p < 2; p++) {
      const x0 = PAD_L + p * (panelW + GAP);
      if (px >= x0 && px <= x0 + panelW) {
        const t = clamp((px - x0) / panelW, 0, 1);
        // Snap to nearest sampled λ.
        const lambdas = curves[pKeys[0]].lambdas;
        let best = lambdas[0], bestD = Infinity;
        for (const l of lambdas) {
          const d = Math.abs(l - t);
          if (d < bestD) { bestD = d; best = l; }
        }
        onLambdaChange(best);
        return;
      }
    }
  };

  const xTicks = curves[pKeys[0]].lambdas;
  // Reasonable y ticks:
  const yTickStep = (yMax - yMin) / 5;
  const yTicks = [];
  for (let i = 0; i <= 5; i++) yTicks.push(+(yMin + i * yTickStep).toFixed(2));

  const buildPath = (xs, ys, panelIdx) => {
    return xs.map((x, i) => `${i ? "L" : "M"}${sx(x, panelIdx).toFixed(1)},${sy(ys[i]).toFixed(1)}`).join(" ");
  };

  const Panel = ({ idx, title, key_ }) => (
    <g>
      <text x={sx(0.5, idx)} y={PAD_T - 14}
        fontFamily="var(--sans)" fontSize="13" fill="var(--ink)"
        textAnchor="middle" fontWeight="600">
        {title}
      </text>

      {xTicks.map((t) => (
        <line key={`gx${idx}-${t}`} x1={sx(t, idx)} x2={sx(t, idx)}
          y1={PAD_T} y2={H - PAD_B}
          stroke="var(--rule)" strokeWidth="1" strokeDasharray="2 4" />
      ))}
      {yTicks.map((t) => (
        <line key={`gy${idx}-${t}`} y1={sy(t)} y2={sy(t)}
          x1={sx(0, idx)} x2={sx(1, idx)}
          stroke="var(--rule)" strokeWidth="1" strokeDasharray="2 4" />
      ))}

      <line x1={sx(0, idx)} x2={sx(1, idx)} y1={H - PAD_B} y2={H - PAD_B}
        stroke="var(--ink)" strokeWidth="1" />
      <line x1={sx(0, idx)} x2={sx(0, idx)} y1={PAD_T} y2={H - PAD_B}
        stroke="var(--ink)" strokeWidth="1" />

      {xTicks.map((t) => (
        <text key={`tx${idx}-${t}`} x={sx(t, idx)} y={H - PAD_B + 18}
          fontFamily="var(--mono)" fontSize="11" fill="var(--muted)" textAnchor="middle">
          {t.toFixed(2)}
        </text>
      ))}
      {idx === 0 && yTicks.map((t) => (
        <text key={`ty${t}`} x={PAD_L - 10} y={sy(t) + 4}
          fontFamily="var(--mono)" fontSize="11" fill="var(--muted)" textAnchor="end">
          {t.toFixed(2)}
        </text>
      ))}

      <text x={sx(0.5, idx)} y={H - 22}
        fontFamily="var(--sans)" fontSize="12" fill="var(--slate)" textAnchor="middle">
        λ — fraction mixed into pretraining
      </text>

      {pKeys.map((p) => {
        const k = Number(p);
        const xs = curves[p].lambdas;
        const ys = curves[p][key_];
        return (
          <g key={`p${idx}-${p}`}>
            <path d={buildPath(xs, ys, idx)}
              fill="none" stroke={seriesColor(k)} strokeWidth="2.25" />
            {xs.map((x, i) => (
              <circle key={`s${idx}-${p}-${i}`}
                cx={sx(x, idx)} cy={sy(ys[i])}
                r="3.5" fill={seriesColor(k)} stroke="var(--bg)" strokeWidth="1.25" />
            ))}
          </g>
        );
      })}

      {/* current-λ markers + vertical line */}
      {pKeys.map((p) => {
        const k = Number(p);
        const xs = curves[p].lambdas;
        const ys = curves[p][key_];
        // find nearest λ index
        let bi = 0, bd = Infinity;
        for (let i = 0; i < xs.length; i++) {
          const d = Math.abs(xs[i] - lambda);
          if (d < bd) { bd = d; bi = i; }
        }
        return (
          <circle key={`m${idx}-${p}`}
            cx={sx(xs[bi], idx)} cy={sy(ys[bi])}
            r="5" fill={seriesColor(k)} stroke="var(--bg)" strokeWidth="2" />
        );
      })}

      <line x1={sx(lambda, idx)} x2={sx(lambda, idx)}
        y1={PAD_T} y2={H - PAD_B}
        stroke="var(--ink)" strokeWidth="1" strokeDasharray="3 3" opacity="0.35" />

      {/* Star at the per-series min-loss λ — drawn LAST so it stays on top of
          the current-λ marker and the vertical guide line. */}
      {pKeys.map((p) => {
        const k = Number(p);
        const xs = curves[p].lambdas;
        const ys = curves[p][key_];
        let minIdx = 0;
        for (let i = 1; i < ys.length; i++) if (ys[i] < ys[minIdx]) minIdx = i;
        return (
          <text key={`star${idx}-${p}`}
            x={sx(xs[minIdx], idx)} y={sy(ys[minIdx])}
            fontSize="22" fill={seriesColor(k)}
            textAnchor="middle" dominantBaseline="central"
            stroke="var(--bg)" strokeWidth="3" paintOrder="stroke fill">★</text>
        );
      })}
    </g>
  );

  return (
    <div className="ushape-wrap">
      <div className="chart-legend">
        {pKeys.map((p) => {
          const k = Number(p);
          return (
            <span key={p} className="chart-legend-item">
              <span className="chart-legend-line" style={{ background: seriesColor(k) }} />
              {seriesLabel(k)}
            </span>
          );
        })}
      </div>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="pareto-svg"
        onClick={handleClick}
        style={{ cursor: onLambdaChange ? "crosshair" : "default" }}>

        <text x={-(PAD_T + innerH / 2)} y={18} transform="rotate(-90)"
          fontFamily="var(--sans)" fontSize="13" fill="var(--slate)" textAnchor="middle">
          MusicPile loss
        </text>

        <Panel idx={0} title="Before fine-tuning · immediate" key_="immediate" />
        <Panel idx={1} title="After fine-tuning · retained" key_="retained" />

        <text x={W - PAD_R} y={PAD_T - 14}
          fontFamily="var(--mono)" fontSize="11" fill="var(--muted)" textAnchor="end">
          λ = {lambda.toFixed(2)}
        </text>
      </svg>
    </div>
  );
}

// ---------- Interventions scatter (Part IV) ----------
// Mirrors plot_dropout_replay_mixed_styled: 4 series per pipeline (unmixed, mixed,
// mixed+dropout, mixed+replay). Data: PAPER_DATA.interventions[pipeline].
// Axes match the paper: x = retained post-training loss, y = fine-tuning loss.
function InterventionsChart({ pipeline = "music-chem", hovered, setHovered }) {
  const W = 720, H = 460;
  const PAD_L = 88, PAD_B = 72, PAD_T = 28, PAD_R = 32;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;

  const P = (PAPER_DATA.interventions || {})[pipeline];
  if (!P) {
    return (
      <div className="pareto-wrap" style={{ color: "var(--muted)", fontFamily: "var(--sans)", fontSize: 13 }}>
        No interventions data for pipeline “{pipeline}”.
      </div>
    );
  }

  // Axis limits = bounding box of the union of every series' frontier points
  // (5% pad). Same rationale as ParetoChart: outliers off-frontier shouldn't
  // dilate the box and hide the comparison between curves.
  const seriesPointArrays = [
    P.unmixed || [], P.mixed || [],
    P.mixedDropout || [], P.mixedReplay || [],
  ];
  const frontierUnion = [];
  for (const pts of seriesPointArrays) {
    if (!pts.length) continue;
    const fr = lowerLeftFrontier(pts.map((p) => [p.x, p.y]));
    for (const p of fr) frontierUnion.push(p);
  }
  const padFrac = 0.05;
  const xs = frontierUnion.map((p) => p[0]);
  const ys = frontierUnion.map((p) => p[1]);
  const xLo = Math.min(...xs), xHi = Math.max(...xs);
  const yLo = Math.min(...ys), yHi = Math.max(...ys);
  const xPad = (xHi - xLo) * padFrac || 0.05;
  const yPad = (yHi - yLo) * padFrac || 0.05;
  const xRange = [xLo - xPad, xHi + xPad];
  const yRange = [yLo - yPad, yHi + yPad];
  const sx = (x) => PAD_L + ((x - xRange[0]) / (xRange[1] - xRange[0])) * innerW;
  const sy = (y) => PAD_T + (1 - (y - yRange[0]) / (yRange[1] - yRange[0])) * innerH;

  const SERIES = [
    { id: "unmixed",       label: "Unmixed (λ=0)",   stroke: "#000000",       points: P.unmixed,      shape: "circle" },
    { id: "mixed",         label: "Mixed (λ=1)",     stroke: "#7b2d8e",       points: P.mixed,        shape: "circle" },
    { id: "mixedDropout",  label: "Mixed + Dropout", stroke: "#2a9d8f",       points: P.mixedDropout, shape: "diamond" },
    { id: "mixedReplay",   label: "Mixed + Replay",  stroke: "#d45e00",       points: P.mixedReplay,  shape: "triangle" },
  ];

  const xTicks = [];
  for (let v = Math.ceil(xRange[0] * 10) / 10; v <= xRange[1] + 1e-9; v += 0.1) xTicks.push(+v.toFixed(2));
  const yTicks = [];
  for (let v = Math.ceil(yRange[0] * 10) / 10; v <= yRange[1] + 1e-9; v += 0.1) yTicks.push(+v.toFixed(2));

  const frontierPath = (pts) => {
    const arr = pts.map((p) => [p.x, p.y]);
    const fr = lowerLeftFrontier(arr);
    if (fr.length < 2) return null;
    return fr.map((p, i) => `${i ? "L" : "M"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");
  };

  const isFaded = (sid) => hovered && hovered.series !== sid;
  const isHotPoint = (sid, idx) => hovered && hovered.series === sid && hovered.idx === idx;

  const renderMarker = (s, idx, p) => {
    const cx = sx(p.x), cy = sy(p.y);
    const baseR = 4.5, hotR = 6.5;
    const r = isHotPoint(s.id, idx) ? hotR : baseR;
    const opacity = isFaded(s.id) ? 0.12 : 0.92;
    const onEnter = () => setHovered({ series: s.id, idx });
    const onLeave = () => setHovered(null);
    const common = {
      onMouseEnter: onEnter, onMouseLeave: onLeave,
      style: { cursor: "pointer", opacity, transition: "opacity 0.15s" },
    };
    if (s.shape === "diamond") {
      const d = `M${cx},${cy - r} L${cx + r},${cy} L${cx},${cy + r} L${cx - r},${cy} Z`;
      return <path key={`m${s.id}${idx}`} d={d} fill={s.stroke} stroke="var(--bg)" strokeWidth="0.8" {...common} />;
    }
    if (s.shape === "triangle") {
      const d = `M${cx},${cy - r * 1.1} L${cx + r},${cy + r * 0.7} L${cx - r},${cy + r * 0.7} Z`;
      return <path key={`m${s.id}${idx}`} d={d} fill={s.stroke} stroke="var(--bg)" strokeWidth="0.8" {...common} />;
    }
    return <circle key={`m${s.id}${idx}`} cx={cx} cy={cy} r={r} fill={s.stroke}
      stroke="var(--bg)" strokeWidth="0.8" {...common} />;
  };

  return (
    <div className="pareto-wrap">
      <div className="chart-legend">
        {SERIES.map((s) => (
          <span key={`lg${s.id}`}
            className="chart-legend-item chart-legend-item--interactive"
            style={{ opacity: isFaded(s.id) ? 0.35 : 1 }}
            onMouseEnter={() => setHovered({ series: s.id, idx: 0 })}
            onMouseLeave={() => setHovered(null)}>
            <span className="chart-legend-swatch" style={{ background: s.stroke }} />
            {s.label}
          </span>
        ))}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="pareto-svg">
        {xTicks.map((t) => (
          <line key={`gx${t}`} x1={sx(t)} x2={sx(t)} y1={PAD_T} y2={H - PAD_B}
            stroke="var(--rule)" strokeWidth="1" strokeDasharray="2 4" />
        ))}
        {yTicks.map((t) => (
          <line key={`gy${t}`} y1={sy(t)} y2={sy(t)} x1={PAD_L} x2={W - PAD_R}
            stroke="var(--rule)" strokeWidth="1" strokeDasharray="2 4" />
        ))}

        <line x1={PAD_L} x2={W - PAD_R} y1={H - PAD_B} y2={H - PAD_B} stroke="var(--ink)" strokeWidth="1" />
        <line x1={PAD_L} x2={PAD_L} y1={PAD_T} y2={H - PAD_B} stroke="var(--ink)" strokeWidth="1" />

        {xTicks.map((t) => (
          <text key={`tx${t}`} x={sx(t)} y={H - PAD_B + 22}
            fontFamily="var(--mono)" fontSize="11" fill="var(--muted)" textAnchor="middle">
            {t.toFixed(2)}
          </text>
        ))}
        {yTicks.map((t) => (
          <text key={`ty${t}`} x={PAD_L - 14} y={sy(t) + 4}
            fontFamily="var(--mono)" fontSize="11" fill="var(--muted)" textAnchor="end">
            {t.toFixed(2)}
          </text>
        ))}

        <text x={PAD_L + innerW / 2} y={H - 18}
          fontFamily="var(--sans)" fontSize="13" fill="var(--slate)" textAnchor="middle">
          {P.x_label} →
        </text>
        <text x={-(PAD_T + innerH / 2)} y={26} transform="rotate(-90)"
          fontFamily="var(--sans)" fontSize="13" fill="var(--slate)" textAnchor="middle">
          {P.y_label} →
        </text>

        <g transform={`translate(${W - PAD_R - 100}, ${PAD_T + 22})`}>
          <text fontFamily="var(--mono)" fontSize="10" fill="var(--muted)" letterSpacing="1">BETTER ↙</text>
        </g>

        <defs>
          <clipPath id="interventionsClip">
            <rect x={PAD_L} y={PAD_T} width={innerW} height={innerH} />
          </clipPath>
        </defs>

        <g clipPath="url(#interventionsClip)">
          {SERIES.map((s) => {
            const d = frontierPath(s.points || []);
            if (!d) return null;
            // Visible 2-wide frontier (no pointer events) + 14-wide invisible hit area
            // so hovering the curve fades the others, just like hovering a marker.
            return (
              <g key={`p${s.id}`}>
                <path d={d} fill="none" stroke={s.stroke}
                  strokeWidth="2" opacity={isFaded(s.id) ? 0.1 : 0.7}
                  style={{ transition: "opacity 0.15s", pointerEvents: "none" }} />
                <path d={d} fill="none" stroke="transparent"
                  strokeWidth="14" pointerEvents="stroke"
                  style={{ cursor: "pointer" }}
                  onMouseEnter={() => setHovered({ series: s.id, idx: 0 })}
                  onMouseLeave={() => setHovered(null)} />
              </g>
            );
          })}

          {SERIES.map((s) => (s.points || []).map((p, i) => renderMarker(s, i, p)))}
        </g>

      </svg>
    </div>
  );
}

// =================== PART I ===================
function PartI() {

    <section id="setup">

      </div>

      <div className="col-wide">
        <div className="pipeline-diagram">
          <div className="pipeline-actor pipeline-actor-upstream">
            <span className="actor-label">Upstream developer&nbsp;·&nbsp;Qwen, DeepSeek</span>

          </div>

          <div className="pipeline-stage stage-pretrain">
            <div className="stage-formal"><em>D</em><sub>pre</sub></div>
            <div className="stage-headline">Pretraining</div>
            <div className="stage-instance">e.g. C4&nbsp;·&nbsp;internet-scale web text</div>
            <div className="stage-note">Builds general language ability.</div>
          </div>

          <div className="pipeline-arrow pipeline-arrow-1" aria-hidden="true">
            <svg viewBox="0 0 80 24" preserveAspectRatio="none">
              <line x1="0" y1="12" x2="72" y2="12" stroke="currentColor" strokeWidth="1.5" />

          </div>

            <div className="stage-formal"><em>D</em><sub>post</sub></div>
            <div className="stage-headline">Post-training</div>
            <div className="stage-instance">e.g. FLAN&nbsp;·&nbsp;instruction following</div>
            <div className="stage-note">Installs a target capability.</div>
          </div>

          <div className="pipeline-arrow pipeline-arrow-2" aria-hidden="true">
            <svg viewBox="0 0 80 24" preserveAspectRatio="none">
              <line x1="0" y1="12" x2="72" y2="12" stroke="currentColor" strokeWidth="1.5" strokeDasharray="3 3" />
              <polyline points="64,6 72,12 64,18" fill="none" stroke="currentColor" strokeWidth="1.5" />

        </div>
      </div>

      <div className="col">
        <h3>The phenomenon: catastrophic forgetting</h3>
        <p>
          When the downstream party fine-tunes a model that has been post-trained, there is a

        </p>

        <div className="callout">
          <div className="callout-label">The phenomenon</div>
          <p style={{ margin: 0 }}>

          </p>
        </div>

function PartII({ lambda, setLambda }) {

        </p>
      </div>

      <div className="col">
        <h3>Saturation experiment (§4.1)</h3>
        <p>
          Run the dedicated post-training stage to convergence; this means repeating
          the post-training dataset as many times as needed until loss no longer improves.
          We sweep <span className="lambda">λ</span> over five values to vary how much of
          the post-training corpus is seen in pretraining. Whether or not there was mixing, 
          we post-train models to their best performance on the post-training dataset.
        </p>
      </div>

      <div className="col-wide figure-compact">
        <figure>
          <LambdaSlider value={lambda} onChange={setLambda} />
          <TrainingTimeline lambda={lambda} mode="main" />
          <ImmediateVsRetainedChart lambda={lambda} onLambdaChange={setLambda} mode="saturation" />
          <figcaption>
            <strong>Figure · Saturation experiment (§4.1)</strong>
            Drag <span className="lambda">λ</span> through its five sampled values.
            The diagram shows what mixing does to pretraining; the paired plot below
            evaluates the same model two ways — left, on held-out <em>D</em>
            <sub>post</sub> right after post-training; right, on the same set after a
            subsequent fine-tuning stage.
          </figcaption>
        </figure>
      </div>

      <div className="col">
        <p>
          On the left, post-training loss is nearly flat across <span className="lambda">λ</span>.
          If we measure model performance immediately after post-training, mixing barely
          seems to matter. The right panel evaluates the same models after one more
          fine-tuning stage, and the picture changes — the benefit was latent all along,
          and only surfaces once the model is adapted further.
        </p>
        <div className="callout">
          <div className="callout-label">Result (§4.1)</div>
          <p style={{ margin: 0 }}>
            Pretraining-time mixing substantially improves retention under subsequent
            fine-tuning — even when it provides little or no benefit to immediate

      <div className="col">
        <h3>Compute-matched experiment (§4.2)</h3>

        </p>
      </div>

      <div className="col-wide figure-compact">
        <figure>
          <LambdaSlider value={cmLambda} onChange={setCmLambda} />
          <TrainingTimeline lambda={cmLambda} mode="compute-matched" />
          <ImmediateVsRetainedChart lambda={cmLambda} onLambdaChange={setCmLambda} mode="interpolation" />
          <figcaption>
            <strong>Figure · Compute-matched experiment (§4.2)</strong>

            300M. The retention benefit of larger <span className="lambda">λ</span> shows

          </figcaption>
        </figure>
      </div>

      <div className="col">
        <p>

          <div className="callout-label">Result (§4.2)</div>
          <p style={{ margin: 0 }}>

      </div>
    </section>
  );
}

              exposure during pretraining, replay during post-training, and
              regularization each shift the retention–adaptation frontier — and
              their effects are largely complementary.
            </div>
          </div>
        </div>
      </div>

      <div className="col">
        <h3>Limitations &amp; future work</h3>
        <div className="limgrid">
          <div>
            <h4>Limitations</h4>
            <ul>
              <li>
                <strong>Single-pass exposure</strong>
                Post-training data is mixed in at most once. We don't characterize
                aggressive repetition.
              </li>
              <li>
                <strong>Limited scale</strong>
                Two model sizes, one fixed pretraining budget. 
              </li>
              <li>
                <strong>One adaptation method</strong>
                Full fine-tuning only. Preference-based fine-tuning is not studied.
              </li>
            </ul>
          </div>
          <div>
            <h4>Future work</h4>
            <ul>
              <li>
                <strong>Map the regime</strong>
                Vary upstream–downstream overlap, exposure level, and repetition intensity.
              </li>
              <li>
                <strong>Scale up</strong>
                Test whether upstream interventions continue to shift the frontier at
                production scale.
              </li>
              <li>
                <strong>Algorithmic substitutes</strong>
                Do there exist training algorithms that approximate early exposure's effect
                without modifying the pretraining corpus?
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  );
}
